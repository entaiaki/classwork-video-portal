<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classwork Video Portal (EN)</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div id="app-shell">
    <header id="site-bar" class="site-bar">
      <div class="wrap site-bar-inner">
        <p id="site-brand"><span id="course-title">Loading course title…</span></p>
        <p id="meta-line">Term Instructor</p>
        <nav id="site-nav">
          <div class="lang-switch" aria-label="Language">
            <a href="index-cn.html">中</a>
            <span class="current">EN</span>
          </div>
          <a class="nav-works" href="#works-track">Works</a>
        </nav>
      </div>
      <div id="scroll-progress" aria-hidden="true"></div>
    </header>

    <main id="workspace">
      <section id="hero" aria-labelledby="page-title">
        <div class="wrap hero-inner">
          <p id="hero-eyebrow" class="reveal-item">Coursework Portal</p>
          <h1 id="page-title" class="reveal-item">Works</h1>
          <p id="work-summary" class="reveal-item"></p>
          <p id="note-text" class="note-text reveal-item">This portal shows group videos in this phase; website links come later.</p>
          <p id="scroll-hint" class="reveal-item" aria-hidden="true">
            <span class="hint-line" aria-hidden="true"></span>
            <span id="scroll-hint-text">Scroll to browse each group</span>
          </p>
        </div>
      </section>

      <div id="works-track">
        <!-- filled by portal.js: 10 × article.work-section -->
      </div>
    </main>

    <nav id="works-rail" aria-label="Works navigation">
      <!-- filled by portal.js: 10 × button.rail-item -->
    </nav>

    <p id="section-counter" aria-hidden="true"><span id="counter-current">01</span><span class="counter-sep">/</span><span id="counter-total">10</span></p>

    <footer class="site-footer">
      <div class="wrap">
        <p class="footer-line">CW-PORTAL-VIDEO-20261109-01 — Video-only phase — Public Pages / sharing require user approval</p>
        <p class="footer-mark" aria-hidden="true">CLASSWORK</p>
      </div>
    </footer>
  </div>

  <div id="player-modal" class="modal" hidden>
    <div id="player-backdrop" class="modal-backdrop" aria-hidden="true"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="modal-head">
        <div>
          <h3 id="player-title">Video</h3>
          <p class="modal-sub" id="player-sub"></p>
        </div>
        <button type="button" id="player-close" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <video id="player-video" controls playsinline preload="metadata" hidden></video>
        <div id="player-fail" class="fail-box" hidden></div>
      </div>
    </div>
  </div>

  <script src="assets/js/portal.js"></script>
</body>
</html>
