<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classwork Video Portal (EN)</title>
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body>
  <div id="app-shell">
    <header id="site-bar" class="site-bar">
      <div class="wrap site-bar-inner">
        <p id="site-brand"><span id="course-title">Loading course title…</span></p>
        <p id="meta-line">Term Instructor</p>
        <nav id="site-nav">
          <div class="lang-switch" aria-label="Language">
            <a href="index-cn.html">中</a>
            <span class="current">EN</span>
          </div>
          <a class="nav-works" href="#work-index">Works</a>
        </nav>
      </div>
    </header>

    <main id="workspace">
      <div class="wrap">
        <header id="page-header">
          <h1 id="page-title">Works</h1>
          <p id="work-summary"></p>
          <p id="note-text" class="note-text">This portal shows group videos in this phase; website links come later.</p>
        </header>

        <div class="workspace-body">
          <section id="work-detail" aria-live="polite">
            <!-- filled by portal.js: Ready inspector, Empty pending, or #detail-empty -->
          </section>

          <section id="work-index" aria-labelledby="page-title">
            <nav id="index-filter" aria-label="Filter by status">
              <button type="button" data-filter="all" aria-pressed="true">All</button>
              <button type="button" data-filter="playable" aria-pressed="false">Playable</button>
              <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
            </nav>
            <div id="work-list" class="work-list" role="list">
              <!-- filled by portal.js: 10 × .work-row -->
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>CW-PORTAL-VIDEO-20261109-01 — Video-only phase — Public Pages / sharing require user approval</p>
      </div>
    </footer>
  </div>

  <div id="player-modal" class="modal" hidden>
    <div id="player-backdrop" class="modal-backdrop" aria-hidden="true"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="modal-head">
        <div>
          <h3 id="player-title">Video</h3>
          <p class="modal-sub" id="player-sub"></p>
        </div>
        <button type="button" id="player-close" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <video id="player-video" controls playsinline preload="metadata" hidden></video>
        <div id="player-fail" class="fail-box" hidden></div>
      </div>
    </div>
  </div>

  <script src="assets/js/portal.js"></script>
</body>
</html>
